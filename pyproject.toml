[project]
name = "receipt-radar-ai"
version = "0.1.0"
description = "AI-powered automated expense tracker"
authors = [
    {name = "Giovanni Hernandez"}
]
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy",
    "psycopg2-binary",
    "openai",
    "python-dotenv",
    "imap-tools",
    "beautifulsoup4",
]

[dependency-groups]
dev = [
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "scripts"]

[tool.ruff]
# Line length (Black standard)
line-length = 88

[tool.ruff.lint]
# Enable standard rules
# E: pycodestyle errors
# F: Pyflakes
# I: isort (import sorting)
# B: flake8-bugbear (finds common bugs)
select = ["E", "F", "I", "B"]
ignore = []

# Allow fixable violations (like unused imports) to be automatically fixed.
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
# Use double quotes, like Black.
quote-style = "double"
# Use spaces for indentation.
indent-style = "space"
# Enable preview features if needed
preview = false
